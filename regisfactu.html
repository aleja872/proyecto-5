<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Facturas</title>
    <link rel="stylesheet" href="regisfactu.css">
</head>
<body>
    <div class="container">
        <h2>Registro de Facturas</h2>
        <form id="facturaForm" action="upload.php" method="POST" enctype="multipart/form-data">
            <label for="proveedor">Proveedor:</label>
            <input type="text" id="proveedor" name="proveedor" required>
            
            <label for="factura">Subir Factura (PDF):</label>
            <input type="file" id="factura" name="factura" accept="application/pdf" required>
            
            <button type="submit">Registrar Factura</button>
        </form>
        <p id="mensaje"></p>
    </div>
    
    <script src="regisfactu.js"></script>
</body>
</html>
